services:
  myownhub:
    build: .
    image: myownhub:latest
    container_name: myownhub
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      - LOGIN_USER=admin
      - LOGIN_PASSWORD=changeme
      - SESSION_SECRET=bitte-aendern-langer-zufaelliger-string
    restart: unless-stopped
