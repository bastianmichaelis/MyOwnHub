<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mein Web-Hub</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <h1>Mein zentraler Web-Hub</h1>
        <p>
          Speichere deine wichtigsten Webseiten an einem Ort und öffne sie mit
          einem Klick.
        </p>
      </header>

      <section class="panel" aria-labelledby="form-title">
        <h2 id="form-title">Neue Website hinzufügen</h2>
        <form id="site-form" class="site-form">
          <label>
            Name
            <input id="name" name="name" type="text" placeholder="z. B. GitHub" required />
          </label>
          <label>
            URL
            <input
              id="url"
              name="url"
              type="url"
              placeholder="https://example.com"
              required
            />
          </label>
          <button type="submit">Hinzufügen</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="list-title">
        <div class="list-header">
          <h2 id="list-title">Gespeicherte Websites</h2>
          <button id="clear-all" class="btn-secondary" type="button">Alle löschen</button>
        </div>
        <ul id="site-list" class="site-list" aria-live="polite"></ul>
        <p id="empty-state" class="empty-state">Noch keine Websites gespeichert.</p>
      </section>
    </main>

    <template id="site-item-template">
      <li class="site-item">
        <a class="site-link" target="_blank" rel="noopener noreferrer"></a>
        <button class="delete-btn" type="button">Entfernen</button>
      </li>
    </template>

    <script src="script.js"></script>
  </body>
</html>
