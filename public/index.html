<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MyOwnHub</title>

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyOwnHub" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <!-- ── Top bar ── -->
    <header class="topbar">
      <div class="topbar-brand">MyOwnHub</div>
      <div class="topbar-right">
        <button id="add-website-btn" class="btn-primary btn-sm">+ Website</button>
        <button id="install-btn" class="btn-secondary btn-sm hidden" title="App installieren">&#8681; App</button>
        <form method="POST" action="/logout" style="display:contents">
          <button type="submit" class="btn-secondary btn-sm" title="Abmelden">&#x2192; Logout</button>
        </form>
      </div>
    </header>

    <!-- ── Websites view ── -->
    <main>
      <div id="websites-grid" class="service-grid"></div>
      <p id="websites-empty" class="empty-msg hidden">
        Noch keine Websites gespeichert.<br>Tippe auf &ldquo;+ Website&rdquo; um eine hinzuzuf&uuml;gen.
      </p>
    </main>

    <!-- ── Website modal (add/edit) ── -->
    <div id="website-modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="website-modal-title">Website hinzuf&uuml;gen</h2>
          <button id="website-modal-close" class="btn-close" aria-label="Schlie&szlig;en">&#x2715;</button>
        </div>
        <form id="website-form" class="modal-form">
          <input id="ws-id" type="hidden" />
          <div class="field">
            <label for="ws-url">URL *</label>
            <div class="url-field-row">
              <input id="ws-url" type="url" placeholder="https://beispiel.de" required />
              <button type="button" id="ws-fetch-favicon" class="btn-secondary btn-sm">Favicon</button>
            </div>
          </div>
          <div class="field">
            <label for="ws-title">Name *</label>
            <input id="ws-title" placeholder="z.B. Jellyfin" required />
          </div>
          <div class="field">
            <label for="ws-description">Beschreibung</label>
            <input id="ws-description" placeholder="Kurze Beschreibung (optional)" />
          </div>
          <div class="field">
            <label for="ws-image">Bild (optional)</label>
            <input id="ws-image" type="file" accept="image/*" />
            <div id="ws-image-preview" class="image-preview hidden">
              <img id="ws-image-current" src="" alt="" />
              <button type="button" id="ws-image-remove" class="btn-danger btn-sm">Entfernen</button>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary">Speichern</button>
            <button type="button" id="website-modal-cancel" class="btn-secondary">Abbrechen</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ── Toast ── -->
    <div id="toast" class="toast" aria-live="polite"></div>

    <script src="/db-browser.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
